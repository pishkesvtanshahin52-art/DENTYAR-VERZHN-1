name: ساخت APK DENTYAR V1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true

      - name: بررسی Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          which java
          which javac
          java -version
          javac -version

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: نصب Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: آماده‌سازی فایل‌های DENTYAR
        run: |
          rm -rf www
          mkdir -p www/js
          mkdir -p www/css

          cp index.html www/index.html

          cp *.js www/js/ 2>/dev/null || true
          cp *.css www/css/ 2>/dev/null || true
          cp *.json www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true
          cp *.jpg www/ 2>/dev/null || true
          cp *.jpeg www/ 2>/dev/null || true
          cp *.webp www/ 2>/dev/null || true

          echo "ساختار WWW:"
          find www -maxdepth 2 -type f | sort

      - name: ایجاد تنظیمات Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.dentyar.app",
            "appName": "DENTYAR",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: ایجاد پروژه Android
        run: |
          npx cap add android

      - name: تنظیم اجباری Java 21 برای Gradle
        run: |
          cd android

          cat >> gradle.properties <<EOF
          org.gradle.java.home=$JAVA_HOME
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          echo "Gradle Java:"
          ./gradlew --version

      - name: همگام‌سازی Android
        run: |
          npx cap sync android

      - name: بررسی نهایی فایل‌های Web
        run: |
          echo "بررسی index.html:"
         
