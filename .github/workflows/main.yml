name: Build DENTYAR V1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: نصب وابستگی‌ها
        run: npm install

      - name: نصب Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: ایجاد Android پروژه
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: همگام‌سازی Capacitor
        run: npx cap sync android

      - name: ساخت APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: ذخیره APK به عنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DENTYAR-V1-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
