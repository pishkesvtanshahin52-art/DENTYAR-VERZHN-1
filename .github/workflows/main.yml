name: Build DENTYAR V1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: نصب وابستگی‌ها
        run: npm install

      - name: آماده‌سازی فایل‌های وب DENTYAR
        run: |
          rm -rf www
          mkdir -p www/js
          mkdir -p www/css

          cp index.html www/index.html

          cp *.js www/js/ 2>/dev/null || true
          cp *.css www/css/ 2>/dev/null || true

          cp *.json www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true
          cp *.jpg www/ 2>/dev/null || true
          cp *.jpeg www/ 2>/dev/null || true
          cp *.webp www/ 2>/dev/null || true

          cp manifest.json www/manifest.json 2>/dev/null || true

          echo "ساختار www:"
          find www -maxdepth 2 -type f | sort

      - name: نصب Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: ایجاد پروژه Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: همگام‌سازی Capacitor
        run: npx cap sync android

      - name: ساخت APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: ذخیره APK
        uses: actions/upload-artifact@v4
        with:
          name: DENTYAR-V1-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
        
