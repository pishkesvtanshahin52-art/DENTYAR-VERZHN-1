name: ساخت APK DENTYAR V1

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: ساخت APK DENTYAR V1
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: بررسی Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          which java
          which javac
          java -version
          javac -version

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: نصب Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: آماده‌سازی فایل‌های DENTYAR
        run: |
          set -e

          rm -rf www
          mkdir -p www/js
          mkdir -p www/css

          test -f index.html

          cp index.html www/index.html

          cp *.js www/js/ 2>/dev/null || true
          cp *.css www/css/ 2>/dev/null || true
          cp *.json www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true
          cp *.jpg www/ 2>/dev/null || true
          cp *.jpeg www/ 2>/dev/null || true
          cp *.webp www/ 2>/dev/null || true

          echo "===== WWW ====="
          find www -maxdepth 2 -type f | sort

      - name: ایجاد تنظیمات Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.dentyar.app",
            "appName": "DENTYAR",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          cat capacitor.config.json

      - name: ایجاد پروژه Android
        run: |
          npx cap add android

      - name: تنظیم Java 21 برای Gradle
        run: |
          set -e

          cd android

          touch gradle.properties

          cat >> gradle.properties <<EOF
          org.gradle.java.home=$JAVA_HOME
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          echo "===== Gradle ====="
          ./gradlew --version

      - name: همگام‌سازی Android
        run: |
          npx cap sync android

      - name: بررسی نهایی فایل‌های Web
        run: |
          set -e

          echo "===== Web ====="
          test -f www/index.html

          echo "===== Android ====="
          test -f android/gradlew
          test -d android/app

          echo "بررسی‌ها موفق بود."

      - name: ساخت APK
        run: |
          set -e

          cd android

          chmod +x gradlew

          echo "===== ساخت APK ====="

          ./gradlew \
            -Dorg.gradle.java.home="$JAVA_HOME" \
            -Dorg.gradle.jvmargs="-Xmx2048m -Dfile.encoding=UTF-8" \
            assembleDebug \
            --stacktrace

      - name: بررسی APK ساخته‌شده
        run: |
          set -e

          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          echo "===== بررسی APK ====="

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK ساخته نشده است."
            find android/app/build/outputs -maxdepth 5 -type f 2>/dev/null || true
            exit 1
          fi

          ls -lh "$APK_PATH"
          file "$APK_PATH"

      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: DENTYAR-V1-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
