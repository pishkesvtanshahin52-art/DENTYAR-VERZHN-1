name: دانلود APK

on:
  workflow_dispatch:
  push:
    branches:
      - اصلی

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد پروژه
        uses: actions/checkout@v4

      - name: نصب Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: آماده‌سازی Node.js
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: ساخت فایل‌های DENTYAR
        run: |
          rm -rf www
          mkdir -p www/js
          mkdir -p www/css

          cp index.html www/index.html

          cp *.js www/js/ 2>/dev/null || true
          cp *.css www/css/ 2>/dev/null || true
          cp *.json www/ 2>/dev/null || true
          cp *.png www/ 2>/dev/null || true
          cp *.jpg www/ 2>/dev/null || true
          cp *.jpeg www/ 2>/dev/null || true
          cp *.webp www/ 2>/dev/null || true

          echo "ساختار WWW:"
          find www -maxdepth 2 -type f | sort

      - name: ایجاد تنظیمات Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.dentyar.app",
            "appName": "DENTYAR",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

      - name: ایجاد پروژه Android
        run: |
          npx cap add android

      - name: همگام‌سازی Android
        run: |
          npx cap sync android

      - name: بررسی Java
        run: |
          java -version
          cd android
          ./gradlew --version

      - name: ساخت APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: آپلود APK
        uses: actions/upload-artifact@v4
        with:
          name: DENTYAR-V1-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
